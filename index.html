<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>山海星光號 · 團購統計表</title>
    <style>
      :root {
        --bg-deep: #020617;
        --bg-card: rgba(15, 23, 42, 0.92);
        --border-muted: rgba(148, 163, 184, 0.4);
        --accent: #38bdf8;
        --accent-2: #facc15;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, sans-serif;
        color: #e5e7eb;
        background:
          radial-gradient(circle at 10% -10%, #1d4ed8 0, transparent 55%),
          radial-gradient(circle at 90% -20%, #a855f7 0, transparent 60%),
          radial-gradient(circle at 50% 120%, #0f766e 0, transparent 60%),
          var(--bg-deep);
      }

      /* 星空背景裝飾 */
      body::before {
        content: "";
        position: fixed;
        inset: -100px;
        background-image:
          radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.7) 0, transparent 55%),
          radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,0.8) 0, transparent 55%);
        opacity: 0.5;
        pointer-events: none;
      }

      .page {
        max-width: 1040px;
        margin: 36px auto 40px;
        padding: 0 18px;
      }

      header { text-align: center; }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        padding: 3px 10px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.3);
        background: rgba(15,23,42,0.7);
        backdrop-filter: blur(8px);
      }
      .badge-dot {
        width: 7px; height: 7px;
        border-radius: 999px;
        background: conic-gradient(from 0deg,#f97316,#facc15,#38bdf8,#a855f7,#f97316);
      }

      h1 {
        font-size: clamp(26px, 4vw, 32px);
        margin-bottom: 6px;
        letter-spacing: .18em;
      }

      .meta-row {
        margin-top: 12px;
        display: flex;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .meta-pill {
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.3);
        background: rgba(15,23,42,0.75);
        font-size: 11px;
      }

      /* 卡片 layout */
      .grid {
        display: grid;
        gap: 18px;
        grid-template-columns: repeat(2, 1fr);
        margin-top: 26px;
      }
      @media (max-width: 600px) {
        .grid { grid-template-columns: 1fr; }
      }

      .card {
        background: var(--bg-card);
        border-radius: 22px;
        padding: 16px 18px;
        border: 1px solid var(--border-muted);
        backdrop-filter: blur(12px);
      }

      .card-title { font-size: 17px; font-weight: 600; }

      table { width: 100%; font-size: 13px; border-collapse: collapse; }
      th, td { padding: 6px 4px; }
      th { opacity: 0.7; border-bottom: 1px solid rgba(255,255,255,0.3); }

      td.qty { text-align: right; }

      /* 按鈕樣式 */
      .form-btn-wrapper {
        text-align: center;
        margin: 50px auto 10px;
      }
      .form-btn {
        display: inline-block;
        padding: 14px 26px;
        border-radius: 12px;
        background: linear-gradient(135deg, #4f8bd6, #8b5cf6);
        color: white;
        font-size: 16px;
        text-decoration: none;
        font-weight: 600;
        box-shadow: 0 6px 24px rgba(0,0,0,0.4);
        transition: 0.2s;
      }
      .form-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 30px rgba(0,0,0,0.48);
      }

      .footer {
        margin-top: 40px;
        text-align: center;
        font-size: 11px;
        opacity: 0.7;
      }
    </style>
  </head>

  <body>
    <div class="page">
      <header>
        <div class="badge">
          <span class="badge-dot"></span>
          山海星光號 · Group Order Map
        </div>

        <h1>山海星光號－團購數量統計表</h1>

        <div class="meta-row">
          <div class="meta-pill">資料來源：統計表單</div>
          <div class="meta-pill" id="status-pill">載入中...</div>
        </div>
      </header>

      <!-- 卡片資料區 -->
      <div class="grid" id="grid"></div>

      <!-- 開啟表單按鈕 -->
      <div class="form-btn-wrapper">
        <a class="form-btn" 
           href="https://docs.google.com/forms/d/e/1FAIpQLSfwDFSyGtieP8HZXF7sMerwJkikMp8yQ65K7lZXDwFOEWRgBw/viewform"
           target="_blank">
          ➜ 開啟團購表單
        </a>
      </div>

      <div class="footer">
        <span>山海星光號團購</span> · for 2025星趴內部統計使用
      </div>
    </div>

    <script>
      const API_URL = 'https://script.google.com/macros/s/AKfycbw8Yaq_fW6YKtLKt2NAYMfr4GdX3fK7stu40J_Q5OqVjvVHAbRLhL7sFSVN_4WaMEfjYA/exec';

      function render(categories) {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';

        categories.forEach(cat => {
          let rows = '';
          (cat.items || []).forEach(item => {
            rows += `
              <tr>
                <td>${item.name}</td>
                <td class="qty">${item.qty}</td>
              </tr>`;
          });

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="card-title">${cat.name}</div>
            <table>
              <thead>
                <tr><th>品項名稱</th><th>數量</th></tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          `;
          grid.appendChild(card);
        });
      }

      async function loadData() {
        const status = document.getElementById('status-pill');

        try {
          status.textContent = '資料載入中...';
          const res = await fetch(API_URL);
          const categories = await res.json();
          render(categories);
          status.textContent = '重新整理即可更新最新數量';
        } catch {
          status.textContent = '載入失敗';
        }
      }

      loadData();
    </script>
  </body>
</html>
