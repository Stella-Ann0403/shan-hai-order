<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>山海星光號 · 團購統計表</title>

    <style>
      :root {
        --bg-deep: #020617;
        --bg-card: rgba(15, 23, 42, 0.92);
        --border-muted: rgba(148, 163, 184, 0.4);
        --accent: #38bdf8;
        --accent-2: #facc15;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #e5e7eb;
        background:
          radial-gradient(circle at 10% -10%, #1d4ed8 0, transparent 55%),
          radial-gradient(circle at 90% -20%, #a855f7 0, transparent 60%),
          radial-gradient(circle at 50% 120%, #0f766e 0, transparent 60%),
          var(--bg-deep);
      }

      body::before {
        content: "";
        position: fixed;
        inset: -100px;
        pointer-events: none;
        background-image:
          radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.7) 0, transparent 55%),
          radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,0.8) 0, transparent 55%),
          radial-gradient(1px 1px at 30% 70%, rgba(255,255,255,0.6) 0, transparent 55%);
        opacity: 0.55;
      }

      .page {
        max-width: 1080px;
        margin: 32px auto 40px;
        padding: 0 16px 32px;
      }

      header {
        text-align: center;
        margin-bottom: 24px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid rgba(248, 250, 252, 0.3);
        background: rgba(15, 23, 42, 0.7);
        backdrop-filter: blur(8px);
        margin-bottom: 8px;
      }

      .badge-dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: conic-gradient(from 0deg, #f97316, #facc15, #38bdf8, #a855f7, #f97316);
      }

      h1 {
        margin: 0 0 4px;
        font-size: clamp(24px, 4vw, 32px);
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .subtitle {
        font-size: clamp(12px, 2.6vw, 14px);
        opacity: 0.82;
        line-height: 1.5;
      }
      .subtitle span { color: var(--accent-2); }

      .meta-row {
        display: flex;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 10px;
        font-size: 11px;
      }

      .meta-pill {
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.4);
        background: rgba(15, 23, 42, 0.8);
        white-space: nowrap;
      }

      /* 卡片 layout：桌機 2 欄、平板以下 1 欄 */
      .grid {
        display: grid;
        gap: 18px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin-top: 26px;
      }

      @media (max-width: 900px) {
        .page {
          margin-top: 24px;
        }
        .grid {
          grid-template-columns: 1fr;
        }
      }

      .card {
        background: var(--bg-card);
        border-radius: 22px;
        padding: 14px 16px 12px;
        border: 1px solid var(--border-muted);
        backdrop-filter: blur(12px);
        box-shadow:
          0 18px 40px rgba(15, 23, 42, 0.9),
          0 0 0 1px rgba(15, 23, 42, 0.9);
      }

      .card-title {
        font-size: clamp(15px, 2.7vw, 18px);
        font-weight: 600;
        margin-bottom: 8px;
      }

      table {
        width: 100%;
        font-size: clamp(12px, 2.4vw, 13px);
        border-collapse: collapse;
      }

      th, td {
        padding: 6px 4px;
      }

      th {
        text-align: left;
        opacity: 0.75;
        border-bottom: 1px solid rgba(148, 163, 184, 0.4);
      }

      th:last-child,
      td.qty {
        text-align: right;
      }

      tr:nth-child(even) td {
        background: rgba(15, 23, 42, 0.7);
      }

      /* 表單按鈕區 */
      .form-btn-wrapper {
        text-align: center;
        margin: 30px auto 10px;
      }

      .form-btn {
        display: inline-block;
        padding: 12px 22px;
        border-radius: 999px;
        background: linear-gradient(135deg, #4f8bd6, #8b5cf6);
        color: #f9fafb;
        font-size: clamp(14px, 3.6vw, 16px);
        font-weight: 600;
        text-decoration: none;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
        transition: transform 0.18s ease, box-shadow 0.18s ease;
      }

      .form-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }

      @media (max-width: 600px) {
        .form-btn {
          width: 100%;
          max-width: 360px;
        }
      }

      .footer {
        margin-top: 30px;
        text-align: center;
        font-size: 11px;
        opacity: 0.78;
      }
    </style>
  </head>

  <body>
    <div class="page">
      <header>
        <div class="badge">
          <span class="badge-dot"></span>
          山海星光號 · Group Order List
        </div>
        <h1>山海星光號－團購數量統計表</h1>

        <div class="subtitle">
          每一個品項，都是在夜空裡閃爍的一顆小星星。<br>
          <span>舉頭望明星，低頭點數量 ✨</span>
        </div>

        <div class="meta-row">
          <div class="meta-pill">資料來源：統計表單</div>
          <div class="meta-pill" id="status-pill">載入中...</div>
        </div>
      </header>

      <!-- 卡片區：由 JS 動態塞入 -->
      <div class="grid" id="grid"></div>

      <!-- 前往填寫表單 -->
      <div class="form-btn-wrapper">
        <a
          class="form-btn"
          href="https://docs.google.com/forms/d/e/1FAIpQLSfwDFSyGtieP8HZXF7sMerwJkikMp8yQ65K7lZXDwFOEWRgBw/viewform"
          target="_blank"
        >
          ✨ 開啟山海星光號團購表單
        </a>
      </div>

      <div class="footer">
        <span>山海星光號團購</span> · for 2025 大學星趴統計使用
      </div>
    </div>

    <script>
      //  Cloudflare Worker URL
      const API_URL = "https://shan-hai-order.ruannworking.workers.dev/";

      function render(categories) {
        const grid = document.getElementById("grid");
        grid.innerHTML = "";

        categories.forEach(cat => {
          let rows = "";
          (cat.items || []).forEach(item => {
            rows += `
              <tr>
                <td>${item.name}</td>
                <td class="qty">${item.qty}</td>
              </tr>
            `;
          });

          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <div class="card-title">${cat.name}</div>
            <table>
              <thead>
                <tr>
                  <th>品項名稱</th>
                  <th>數量</th>
                </tr>
              </thead>
              <tbody>
                ${rows}
              </tbody>
            </table>
          `;
          grid.appendChild(card);
        });
      }

      async function loadData() {
        const status = document.getElementById("status-pill");
        try {
          status.textContent = "資料載入中...";
          const res = await fetch(API_URL);
          const categories = await res.json();
          render(categories);
          status.textContent = "重新整理即可看到最新數量";
        } catch (err) {
          console.error(err);
          status.textContent = "載入失敗，請稍後再試";
          document.getElementById("grid").innerHTML =
            '<p style="text-align:center;opacity:0.8;">無法載入資料，請稍後重試。</p>';
        }
      }

      loadData();
    </script>
  </body>
</html>
