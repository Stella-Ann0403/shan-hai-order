<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>山海星光號 · 團購統計表</title>
    <style>
      /* ==== 基底背景：星空＋漸層 ==== */
      :root {
        --bg-deep: #020617;
        --bg-card: rgba(15, 23, 42, 0.92);
        --border-muted: rgba(148, 163, 184, 0.4);
        --accent: #38bdf8;
        --accent-soft: rgba(56, 189, 248, 0.18);
        --accent-2: #facc15;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #e5e7eb;
        background:
          radial-gradient(circle at 10% -10%, #1d4ed8 0, transparent 55%),
          radial-gradient(circle at 90% -20%, #a855f7 0, transparent 60%),
          radial-gradient(circle at 50% 120%, #0f766e 0, transparent 60%),
          var(--bg-deep);
        position: relative;
        overflow-x: hidden;
      }

      /* 星星點點 */
      body::before,
      body::after {
        content: "";
        position: fixed;
        inset: -100px;
        pointer-events: none;
        background-image:
          radial-gradient(1px 1px at 10% 20%, rgba(248, 250, 252, 0.7) 0, transparent 55%),
          radial-gradient(1px 1px at 80% 10%, rgba(248, 250, 252, 0.9) 0, transparent 55%),
          radial-gradient(1px 1px at 30% 70%, rgba(248, 250, 252, 0.6) 0, transparent 55%),
          radial-gradient(1px 1px at 60% 40%, rgba(248, 250, 252, 0.8) 0, transparent 55%);
        opacity: 0.55;
        z-index: -1;
      }
      body::after {
        animation: twinkle 12s linear infinite alternate;
        opacity: 0.85;
      }

      @keyframes twinkle {
        0% { transform: translate3d(0,0,0); opacity: 0.5; }
        100% { transform: translate3d(-20px,-10px,0); opacity: 1; }
      }

      /* ==== 版面 ==== */
      .page {
        max-width: 1040px;
        margin: 36px auto 40px;
        padding: 0 18px 40px;
      }

      header {
        text-align: center;
        margin-bottom: 26px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        padding: 3px 10px;
        border-radius: 999px;
        border: 1px solid rgba(248, 250, 252, 0.3);
        background: rgba(15, 23, 42, 0.7);
        backdrop-filter: blur(8px);
        margin-bottom: 8px;
      }
      .badge-dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: conic-gradient(from 0deg, #f97316, #facc15, #38bdf8, #a855f7, #f97316);
      }

      h1 {
        margin: 0 0 6px;
        font-size: clamp(26px, 4vw, 32px);
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .subtitle {
        font-size: 13px;
        opacity: 0.82;
      }

      .subtitle span { color: var(--accent-2); }

      /* 上方小資訊列 */
      .meta-row {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 14px;
        font-size: 11px;
        opacity: 0.8;
      }
      .meta-pill {
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.4);
        background: rgba(15, 23, 42, 0.75);
      }

      /* 卡片網格：固定 2 欄  */
      .grid {
        display: grid;
        gap: 18px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin-top: 26px;
      }

      /* 手機變 1 欄 */
      @media (max-width: 600px) {
        .page {
          margin-top: 24px;
          padding-bottom: 28px;
        }
        .grid {
          grid-template-columns: 1fr;
        }
      }

      /* ==== 卡片樣式 ==== */
      .card {
        position: relative;
        background: var(--bg-card);
        border-radius: 22px;
        padding: 16px 18px 14px;
        border: 1px solid var(--border-muted);
        box-shadow:
          0 22px 45px rgba(15, 23, 42, 0.92),
          0 0 0 1px rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(12px);
        overflow: hidden;
      }

      .card::before {
        content: "";
        position: absolute;
        top: -40px;
        right: -40px;
        width: 120px;
        height: 120px;
        background:
          radial-gradient(circle at 30% 30%, rgba(248, 250, 252, 0.9) 0, transparent 40%),
          radial-gradient(circle at 60% 60%, rgba(56, 189, 248, 0.3) 0, transparent 55%);
        opacity: 0.18;
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 8px;
        gap: 8px;
      }

      .card-title {
        font-size: 17px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .card-title-icon {
        width: 14px;
        height: 14px;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.8);
        background:
          radial-gradient(circle at 30% 30%, #e5e7eb 0, transparent 50%),
          radial-gradient(circle at 70% 80%, #38bdf8 0, transparent 60%);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th, td { padding: 6px 4px; }
      th {
        text-align: left;
        opacity: 0.75;
        border-bottom: 1px solid rgba(148, 163, 184, 0.4);
      }
      th:last-child { text-align: right; }
      td.qty {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      tr:nth-child(even) td {
        background: rgba(15, 23, 42, 0.7);
      }

      .item-name {
        display: inline-flex;
        align-items: baseline;
        gap: 6px;
      }
      .item-bullet {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: rgba(249, 250, 251, 0.85);
        box-shadow: 0 0 6px rgba(248, 250, 252, 0.8);
      }

      .footer {
        margin-top: 24px;
        text-align: center;
        font-size: 11px;
        opacity: 0.78;
      }
      .footer span { color: var(--accent); }

      /* ====== 表單區塊：外層可滾動 ====== */
      .form-container {
        width: 100%;
        max-width: 900px;
        margin: 32px auto 16px;
      }

      .form-wrapper {
        width: 100%;
        height: 1200px;              /* 表單可視高度 */
        border-radius: 12px;
        overflow-y: auto;            /* 這裡出現卷軸 */
        -webkit-overflow-scrolling: touch;
        background: rgba(15, 23, 42, 0.85);
      }

      #google-form {
        width: 100%;
        height: 3000px;              /* 設高一點，避免被截斷 */
        border: none;
      }
    </style>
  </head>

  <body>
    <div class="page">
      <header>
        <div class="badge">
          <span class="badge-dot"></span>
          山海星光號 · Group Order Map
        </div>
        <h1>山海星光號-目前團購統計表</h1>
        <div class="subtitle">
          每一個品項，都是在夜空裡閃爍的一顆小星星。<br>
          <span>抬頭看星，低頭點數量 ✨</span>
        </div>
        <div class="meta-row">
          <div class="meta-pill">資料來源：統計表單</div>
          <div class="meta-pill" id="status-pill">載入中...</div>
        </div>
      </header>

      <!-- 統計卡片 -->
      <div class="grid" id="grid"></div>

      <!-- Google 表單可滾動區塊 -->
      <div class="form-container">
        <div class="form-wrapper">
          <iframe 
            src="https://docs.google.com/forms/d/e/1FAIpQLSfwDFSyGtieP8HZXF7sMerwJkikMp8yQ65K7lZXDwFOEWRgBw/viewform?embedded=true"
            frameborder="0"
            marginheight="0"
            marginwidth="0"
            scrolling="no"
            id="google-form"
          >載入中…</iframe>
        </div>
      </div>

      <div class="footer">
        <span>山海星光號團購</span> · for 2025星趴內部統計使用
      </div>
    </div>

    <script>
      // TODO：之後你要鎖 API 的話，這裡可以改成 API_URL + "?key=你的key"
      const API_URL = 'https://script.google.com/macros/s/AKfycbw8Yaq_fW6YKtLKt2NAYMfr4GdX3fK7stu40J_Q5OqVjvVHAbRLhL7sFSVN_4WaMEfjYA/exec';

      function render(categories) {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';

        categories.forEach(cat => {
          let rowsHtml = '';
          (cat.items || []).forEach(item => {
            rowsHtml += `
              <tr>
                <td>
                  <span class="item-name">
                    <span class="item-bullet"></span>
                    <span>${item.name}</span>
                  </span>
                </td>
                <td class="qty">${item.qty}</td>
              </tr>
            `;
          });

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="card-header">
              <div class="card-title">
                <span class="card-title-icon"></span>
                ${cat.name}
              </div>
            </div>
            <table>
              <thead>
                <tr>
                  <th>品項名稱</th>
                  <th>數量</th>
                </tr>
              </thead>
              <tbody>
                ${rowsHtml}
              </tbody>
            </table>
          `;
          grid.appendChild(card);
        });
      }

      async function loadData() {
        const status = document.getElementById('status-pill');
        try {
          status.textContent = '資料載入中...';
          const res = await fetch(API_URL);
          const categories = await res.json();
          render(categories);
          status.textContent = '重新整理頁面即可更新最新數量';
        } catch (err) {
          console.error(err);
          status.textContent = '載入失敗，請稍後再試';
          document.getElementById('grid').innerHTML =
            '<p style="text-align:center;opacity:0.8;">無法載入資料，請稍後重試。</p>';
        }
      }

      loadData();
    </script>
  </body>
</html>
